name: OldEmby Build (Theos armv7 iOS6-9)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug

# Minimal permissions
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      THEOS: ${{ github.workspace }}/theos
      # Public fallback SDK sources (copyright-safe: SDK fetched at CI time, not committed)
      # Primary: theos/sdks official patched SDKs (iPhoneOS9.3.sdk, lightweight tbd)
      SDK_FALLBACK_URL: "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS9.3.sdk.tar.xz"
      SDK_FALLBACK_MIRROR: "https://github.com/xybp888/iOS-SDKs/archive/refs/heads/master.tar.gz"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e
          # NB: ldid is NOT in Ubuntu repos and must not appear in these apt lines -
          # one unknown package makes apt abort the whole line. ldid gets its own step.
          # Mirrors the dependency list of theos/bin/install-theos (Debian case).
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential fakeroot rsync curl perl zip git libxml2 \
            libplist-utils dpkg-dev binutils xz-utils unzip zip file
          # Runtime dependency of the iOS toolchain (per theos/bin/install-theos)
          sudo apt-get install -y libtinfo6
          # Prefer the sysv fakeroot backend, as install-theos does
          sudo update-alternatives --set fakeroot /usr/bin/fakeroot-sysv 2>/dev/null || true
          fakeroot --version
          echo "deps installed"

      - name: Install ldid
        run: |
          set -e
          if command -v ldid >/dev/null 2>&1; then
            echo "ldid already available at $(command -v ldid)"
            exit 0
          fi
          echo "Installing ldid from Procursus..."
          curl -LfsS --retry 3 -o /tmp/ldid \
            "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64"
          chmod +x /tmp/ldid
          sudo mv /tmp/ldid /usr/local/bin/ldid
          command -v ldid && echo "ldid ready"

      - name: Install Theos
        run: |
          set -e
          if [ -d "$THEOS/.git" ]; then
            echo "Theos already cloned"
          else
            git clone --recursive https://github.com/theos/theos.git "$THEOS"
          fi
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          ls -lh "$THEOS/makefiles/common.mk"

      # The missing step that used to produce a ~1KB "IPA": without this
      # toolchain $THEOS/toolchain/linux/iphone/bin/clang does not exist and
      # every compile fails with Error 127. Same toolchain the official
      # theos/bin/install-theos installs on Linux.
      - name: Install iOS toolchain (clang for linux -> iphone)
        run: |
          set -e
          if [ -x "$THEOS/toolchain/linux/iphone/bin/clang" ]; then
            echo "Toolchain already installed"
          else
            ARCH=$(uname -m)
            echo "Downloading iOSToolchain (${ARCH})..."
            curl -fL --retry 3 --retry-delay 5 -o /tmp/toolchain.tar.xz \
              "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-${ARCH}.tar.xz"
            ls -lh /tmp/toolchain.tar.xz
            mkdir -p "$THEOS/toolchain"
            tar -xJf /tmp/toolchain.tar.xz -C "$THEOS/toolchain/"
          fi
          "$THEOS/toolchain/linux/iphone/bin/clang" --version | head -3

      - name: Fetch iPhoneOS SDK (Secrets-aware, no log leak)
        env:
          SDK_URL: ${{ secrets.SDK_URL }}
          SDK_MIRROR_URL: ${{ secrets.SDK_MIRROR_URL }}
        run: |
          set -e
          mkdir -p "$THEOS/sdks"
          if [ -n "$SDK_URL" ]; then echo "::add-mask::$SDK_URL"; fi
          if [ -n "$SDK_MIRROR_URL" ]; then echo "::add-mask::$SDK_MIRROR_URL"; fi
          echo "Checking SDK in \$THEOS/sdks..."
          ls -d "$THEOS"/sdks/*.sdk 2>&1 | head -20 || echo "No SDK yet"

          # Determine effective URL: Secrets > fallback
          EFFECTIVE_URL=""
          if [ -n "$SDK_URL" ]; then
            EFFECTIVE_URL="$SDK_URL"
            echo "Using SDK_URL from Secrets (masked)"
          else
            EFFECTIVE_URL="$SDK_FALLBACK_URL"
            echo "Secrets.SDK_URL not set, using public fallback:"
            echo "  $SDK_FALLBACK_URL"
            echo "  (No secret leaked - public community SDK)"
          fi

          # Helper to fetch and extract
          fetch_sdk() {
            local url="$1"
            local out="/tmp/sdk.tar.xz"
            echo "Fetching SDK from: ${url:0:60}... (truncated for log hygiene)"
            if curl -LfsS --retry 3 --retry-delay 5 -o "$out" "$url"; then
              echo "Download OK: $(du -h "$out" | cut -f1)"
              if file "$out" | grep -q "XZ"; then
                tar -xJf "$out" -C "$THEOS/sdks"
              elif file "$out" | grep -q "gzip"; then
                # Mirror archives (e.g. xybp888/iOS-SDKs) wrap SDKs in a top-level dir
                rm -rf /tmp/ios-sdks
                mkdir -p /tmp/ios-sdks
                tar -xzf "$out" -C /tmp/ios-sdks
                cp -R /tmp/ios-sdks/*/iPhoneOS9.3.sdk "$THEOS/sdks/" 2>/dev/null || \
                  cp -R /tmp/ios-sdks/*/iPhoneOS*.sdk "$THEOS/sdks/" 2>/dev/null || true
              elif file "$out" | grep -qi "zip"; then
                rm -rf /tmp/sdk-unzip
                mkdir -p /tmp/sdk-unzip
                unzip -q "$out" -d /tmp/sdk-unzip
                cp -R /tmp/sdk-unzip/*/*.sdk "$THEOS/sdks/" 2>/dev/null || \
                  cp -R /tmp/sdk-unzip/*.sdk "$THEOS/sdks/" 2>/dev/null || true
              else
                tar -xf "$out" -C "$THEOS/sdks" || true
              fi
              return 0
            else
              echo "Download failed for $url (truncated log)"
              return 1
            fi
          }

          # If SDK already present, skip download
          if ls -d "$THEOS"/sdks/iPhoneOS*.sdk >/dev/null 2>&1; then
            echo "SDK already present, skip download"
            ls -lh "$THEOS/sdks/"
          else
            if ! fetch_sdk "$EFFECTIVE_URL"; then
              echo "Primary SDK fetch failed, trying mirror fallback..."
              MIRROR="${SDK_MIRROR_URL:-$SDK_FALLBACK_MIRROR}"
              fetch_sdk "$MIRROR" || {
                echo "::error::Failed to fetch any SDK. Check Secrets.SDK_URL or network."
                exit 1
              }
            fi
          fi

          echo "=== SDKs installed ==="
          ls -lh "$THEOS/sdks/" | head -40
          if [ ! -d "$THEOS/sdks/iPhoneOS9.3.sdk" ]; then
            echo "::error::iPhoneOS9.3.sdk missing (required for TARGET=iphone:clang:9.3:6.0)"
            ls -d "$THEOS"/sdks/*.sdk 2>&1 | head -20
            exit 1
          fi

          # theos/sdks iPhoneOS9.3.sdk: libSystem.tbd re-exports
          # /usr/lib/system/liblaunch.dylib but the archive omits liblaunch.tbd,
          # so ld fails with "file not found: /usr/lib/system/liblaunch.dylib".
          # Ship a minimal link-time stub; the real dylib exists on device.
          LAUNCH_TBD="$THEOS/sdks/iPhoneOS9.3.sdk/usr/lib/system/liblaunch.tbd"
          if [ ! -f "$LAUNCH_TBD" ]; then
            echo "Creating liblaunch.tbd stub (missing from theos/sdks archive)"
            printf '%s\n' \
              '---' \
              'archs:                 [ armv7, armv7s, arm64 ]' \
              'platform:              ios' \
              'install-name:          /usr/lib/system/liblaunch.dylib' \
              'current-version:       442.1.1' \
              'compatibility-version: 1' \
              '...' > "$LAUNCH_TBD"
          fi
          echo "SDK setup complete"

      - name: Build (make package)
        run: |
          set -e -o pipefail
          export THEOS="$THEOS"
          echo "THEOS=$THEOS"
          echo "ARCHS=armv7 TARGET=iphone:clang:9.3:6.0"
          make clean 2>&1 | tail -10 || true
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            make -j"$(nproc)" package DEBUG=1
          else
            make -j"$(nproc)" package FINALPACKAGE=1
          fi

          echo "=== Build artifacts ==="
          ls -R .theos | head -60 || true
          ls -lh packages/ || true

          # Fail loudly instead of packaging a hollow .app
          BIN=".theos/obj/OldEmby.app/OldEmby"
          if [ ! -f "$BIN" ]; then
            echo "::error::Build produced no binary at $BIN"
            exit 1
          fi
          file "$BIN"
          file "$BIN" | grep -q "Mach-O" || { echo "::error::$BIN is not a Mach-O binary"; exit 1; }
          ls -lh "$BIN"

      - name: Assemble IPA (Payload/OldEmby.app → .ipa)
        run: |
          set -e
          # Prefer the canonical bundle dir; .theos holds several OldEmby.app
          # copies (obj/, obj/<arch>/, _/Applications/) whose find order is not
          # stable - only the canonical one always has Info.plist + binary.
          APP_PATH=".theos/obj/OldEmby.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find .theos -type d -name "OldEmby.app" -exec sh -c '[ -f "$1/Info.plist" ]' _ {} \; -print 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "::error::OldEmby.app not found"
            exit 1
          fi
          echo "App path: $APP_PATH"
          ls -la "$APP_PATH"
          BIN="$APP_PATH/OldEmby"
          if [ ! -f "$BIN" ]; then
            echo "::error::OldEmby.app has no executable binary; refusing to package an empty IPA"
            exit 1
          fi
          file "$BIN"
          file "$BIN" | grep -q "Mach-O" || { echo "::error::$BIN is not a Mach-O binary"; exit 1; }

          # Theos already pseudo-signs the binary with a plain `ldid -S`.
          # Do NOT embed entitlements.plist here: sideload tools re-sign the
          # whole app with a personal certificate, which cannot carry
          # jailbreak entitlements (platform-application etc.) - installs
          # then fail as a "damaged" package in 爱思助手/AltStore/Sideloadly.
          # Guard: fail the build if any entitlements snuck into the binary.
          ENT=$(ldid -e "$BIN" 2>/dev/null || true)
          if echo "$ENT" | grep -q "<key>"; then
            echo "::error::Binary carries embedded entitlements; personal-cert re-signing cannot install it:"
            echo "$ENT"
            exit 1
          fi
          echo "Binary has a clean pseudo-signature (no entitlements) - sideload re-sign friendly"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # Structural sanity checks that installers rely on
          PLIST="Payload/OldEmby.app/Info.plist"
          [ -f "$PLIST" ] || { echo "::error::Info.plist missing from app bundle"; exit 1; }
          for key in CFBundleIdentifier CFBundleExecutable CFBundleVersion MinimumOSVersion; do
            plistutil -i "$PLIST" -f xml | grep -q "<key>$key</key>" \
              || { echo "::error::Info.plist lacks required key $key"; exit 1; }
          done
          echo "Info.plist structure OK"

          VERSION=$(grep -m1 "^Version:" control | awk '{print $2}')
          COMMIT=$(git rev-parse --short HEAD)
          IPA_NAME="OldEmby-${VERSION}-${COMMIT}-armv7.ipa"
          rm -f OldEmby-armv7.ipa
          # -X drops __MACOSX/junk entries; content goes in un-compressed by
          # default on Linux, which is what installers expect inside an IPA
          zip -r -X "$IPA_NAME" Payload >/dev/null
          cp "$IPA_NAME" OldEmby-armv7.ipa
          echo "IPA created:"
          ls -lh *.ipa
          unzip -l "$IPA_NAME" | head -10

      - name: Upload Artifact (IPA + deb)
        uses: actions/upload-artifact@v4
        with:
          name: OldEmby-${{ github.sha }}-armv7
          path: |
            *.ipa
            packages/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          echo "### OldEmby Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: $(git rev-parse --short HEAD 2>/dev/null || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
          echo "- Build type: ${{ inputs.build_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- SDKs: $(ls -1 $THEOS/sdks/*.sdk 2>/dev/null | xargs -n1 basename | tr '\n' ',' || echo 'none')" >> $GITHUB_STEP_SUMMARY
          echo "- Artifacts: $(ls -1 *.ipa 2>/dev/null | tr '\n' ',' || echo 'none') $(ls -1 packages/*.deb 2>/dev/null | tr '\n' ',' || echo '')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install via AltStore/Sideloadly or jailbreak dpkg -i." >> $GITHUB_STEP_SUMMARY
